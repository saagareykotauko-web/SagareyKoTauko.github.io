<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Sagarey Ko Tauko - Game Hub</title>
<style>
  :root{
    --sky-top:#1b1033;
    --sky-mid:#3a1f5c;
    --sky-bottom:#7a3b6b;
    --accent:#ffb84d;
    --accent2:#ff5e7e;
    --panel:#221336;
    --gold:#f4c542;
    --green:#4bd47a;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0;padding:0;min-height:100%;
    font-family:'Segoe UI',system-ui,sans-serif;
    background:#0d0618;
    overflow-x:hidden;
    touch-action:manipulation;
  }
  #app{
    display:flex;flex-direction:column;align-items:center;
    min-height:100vh;
    background:radial-gradient(ellipse at 50% -10%, #4a2a6b 0%, #0d0618 70%);
    padding:10px 0 24px 0;
  }
  h1{
    color:var(--gold);
    font-size:1.4rem;
    letter-spacing:1px;
    margin:8px 0 2px 0;
    text-shadow:0 2px 0 rgba(0,0,0,0.4);
    text-align:center;
  }
  .sub{
    color:#c9b8e0;
    font-size:0.7rem;
    margin-bottom:12px;
    letter-spacing:2px;
    text-transform:uppercase;
    opacity:0.8;
  }

  /* MENU */
  #menu{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:14px;
    width:92vw;
    max-width:380px;
  }
  .card{
    background:linear-gradient(160deg, var(--panel), #170a26);
    border:1px solid rgba(244,197,66,0.25);
    border-radius:16px;
    padding:14px 10px;
    display:flex;flex-direction:column;align-items:center;
    cursor:pointer;
    box-shadow:0 6px 16px rgba(0,0,0,0.4);
    transition:transform 0.15s ease;
  }
  .card:active{transform:scale(0.96);}
  .card img{
    width:56px;height:56px;border-radius:50%;
    object-fit:cover;
    border:2px solid var(--gold);
    margin-bottom:8px;
  }
  .card .name{color:#fff;font-weight:700;font-size:0.85rem;text-align:center;}
  .card .desc{color:#a898c9;font-size:0.65rem;text-align:center;margin-top:2px;}
  .card .best{color:var(--gold);font-size:0.65rem;margin-top:6px;}

  /* GAME SCREEN */
  #gameScreen{display:none;flex-direction:column;align-items:center;width:100%;}
  #topBar{
    display:flex;align-items:center;justify-content:space-between;
    width:92vw;max-width:380px;
    margin-bottom:6px;
  }
  #backBtn{
    background:rgba(255,255,255,0.08);
    border:1px solid rgba(255,255,255,0.15);
    color:#fff;
    padding:6px 14px;
    border-radius:20px;
    font-size:0.75rem;
    cursor:pointer;
  }
  #gameTitle{color:var(--gold);font-weight:700;font-size:0.9rem;}
  #canvasHolder{position:relative;}
  canvas{
    background:linear-gradient(180deg,var(--sky-top) 0%,var(--sky-mid) 45%,var(--sky-bottom) 100%);
    border-radius:14px;
    box-shadow:0 0 0 4px var(--panel), 0 12px 40px rgba(0,0,0,0.6);
    max-width:92vw;
    touch-action:none;
  }
  #scoreBadge{
    position:absolute;
    top:14px;
    left:50%;
    transform:translateX(-50%);
    background:rgba(13,6,24,0.55);
    color:var(--gold);
    font-weight:700;
    font-size:1.5rem;
    padding:4px 16px;
    border-radius:20px;
    border:1px solid rgba(244,197,66,0.4);
    pointer-events:none;
  }
  #overlay{
    position:absolute;
    inset:0;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    background:rgba(13,6,24,0.78);
    border-radius:14px;
    color:#fff;
    text-align:center;
    padding:20px;
  }
  #overlay.hidden{display:none;}
  #overlay img{
    width:70px;height:70px;border-radius:50%;
    object-fit:cover;
    border:3px solid var(--gold);
    margin-bottom:10px;
  }
  #overlay h2{margin:0 0 4px 0;color:var(--gold);font-size:1.2rem;}
  #overlay p{margin:2px 0;color:#d9cdf0;font-size:0.8rem;}
  #bestRow{margin-top:6px;font-size:0.72rem;color:#a898c9;line-height:1.5;}
  button.playBtn{
    margin-top:14px;
    background:linear-gradient(180deg,var(--accent),var(--accent2));
    border:none;
    color:#2a0f24;
    font-weight:800;
    font-size:0.95rem;
    padding:9px 26px;
    border-radius:30px;
    cursor:pointer;
    box-shadow:0 6px 0 #a83a52, 0 8px 18px rgba(0,0,0,0.4);
  }
  button.playBtn:active{box-shadow:0 2px 0 #a83a52;transform:translateY(4px);}
  .hint{color:#8a7aa8;font-size:0.68rem;margin-top:8px;letter-spacing:0.5px;text-align:center;}
  footer{color:#5f4d7a;font-size:0.62rem;margin-top:12px;letter-spacing:1px;text-align:center;}
</style>
</head>
<body>
<div id="app">
  <h1>SAGAREY KO TAUKO</h1>
  <div class="sub">4 games, one funny head</div>
  <div class="sub" style="margin-top:-8px;">सागरे को टाउको मा स्वागत छ</div>

  <div id="menu">
    <div class="card" data-game="flappy">
      <img class="head-sprite"/>
      <div class="name">Flappy Head</div>
      <div class="desc">Dodge the pipes</div>
      <div class="best" id="bestFlappy">Best: 0</div>
    </div>
    <div class="card" data-game="basket">
      <img class="head-sprite"/>
      <div class="name">Head Basket</div>
      <div class="desc">Shoot the hoop</div>
      <div class="best" id="bestBasket">Best: 0</div>
    </div>
    <div class="card" data-game="match">
      <img class="head-sprite"/>
      <div class="name">Size Match</div>
      <div class="desc">Tap matching size</div>
      <div class="best" id="bestMatch">Best: 0</div>
    </div>
    <div class="card" data-game="slicer">
      <img class="head-sprite"/>
      <div class="name">Head Slicer</div>
      <div class="desc">Swipe to slice</div>
      <div class="best" id="bestSlicer">Best: 0</div>
    </div>
  </div>

  <div id="gameScreen">
    <div id="topBar">
      <button id="backBtn">&larr; Menu</button>
      <div id="gameTitle">Game</div>
      <div style="width:60px;"></div>
    </div>
    <div id="canvasHolder">
      <canvas id="gameCanvas" width="360" height="560"></canvas>
      <div id="scoreBadge">0</div>
      <div id="overlay">
        <img class="head-sprite"/>
        <h2 id="overlayTitle">Game</h2>
        <p id="overlayMsg">Instructions</p>
        <div id="bestRow">Best: 0</div>
        <button class="playBtn" id="startBtn">Start</button>
      </div>
    </div>
    <div class="hint" id="hintText">TAP / CLICK</div>
  </div>

  <footer>made with your head, sagar 😄</footer>
</div>

  // ---------- Nepali voice lines (text-to-speech, no audio files needed) ----------
  let nepaliVoice = null;
  function loadVoices(){
    if(!('speechSynthesis' in window)) return;
    const voices = speechSynthesis.getVoices();
    nepaliVoice = voices.find(v=>/ne(-|_)?NP/i.test(v.lang)) || voices.find(v=>/hi(-|_)?IN/i.test(v.lang)) || null;
  }
  if('speechSynthesis' in window){
    loadVoices();
    speechSynthesis.onvoiceschanged = loadVoices;
  }
  function speak(text){
    try{
      if(!('speechSynthesis' in window)) return;
      speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      if(nepaliVoice) u.voice = nepaliVoice;
      u.lang = nepaliVoice ? nepaliVoice.lang : 'ne-NP';
      u.rate = 1.02;
      u.pitch = 1.05;
      speechSynthesis.speak(u);
    }catch(e){ /* silently ignore - never break the game over a voice glitch */ }
  }

  // ---------- Today / Week / All-time high score tracking ----------
  function pushHistory(game, score){
    const key = 'sk_hist_'+game;
    let hist = [];
    try{ hist = JSON.parse(localStorage.getItem(key)||'[]'); }catch(e){ hist=[]; }
    hist.push({s:score, t:Date.now()});
    if(hist.length>300) hist = hist.slice(hist.length-300);
    try{ localStorage.setItem(key, JSON.stringify(hist)); }catch(e){}
  }
  function getStats(game){
    const key = 'sk_hist_'+game;
    let hist = [];
    try{ hist = JSON.parse(localStorage.getItem(key)||'[]'); }catch(e){ hist=[]; }
    const now = Date.now();
    const startOfToday = new Date(); startOfToday.setHours(0,0,0,0);
    const weekAgo = now - 7*24*60*60*1000;
    let today=0, week=0, allTime=0;
    for(const h of hist){
      if(h.s>allTime) allTime=h.s;
      if(h.t>=startOfToday.getTime() && h.s>today) today=h.s;
      if(h.t>=weekAgo && h.s>week) week=h.s;
    }
    return {today, week, allTime};
  }
  function statsHtml(game){
    const s = getStats(game);
    return 'Today: <b>'+s.today+'</b> &nbsp;|&nbsp; Week: <b>'+s.week+'</b> &nbsp;|&nbsp; All-time: <b>'+s.allTime+'</b>';
  }

  // ============ FLAPPY HEAD ============
  const FlappyGame = (function(){
    const GRAVITY=0.42, FLAP=-7.6, PIPE_W=60, PIPE_GAP=158, PIPE_SPEED=2.6, PIPE_INTERVAL=100;
    let bird,pipes,frame,score,state,groundOffset;

    function reset(){
      bird={x:90,y:H/2,vy:0,r:24,rot:0};
      pipes=[]; frame=0; score=0; groundOffset=0; state='ready';
      scoreBadge.textContent='0';
    }
    function spawnPipe(){
      const margin=60;
      const top=margin+Math.random()*(H-PIPE_GAP-margin*2-60);
      pipes.push({x:W+PIPE_W,top:top,passed:false});
    }
    function endGame(){
      state='over';
      pushHistory('flappy',score);
      const best=getBest('sk_flappy');
      if(score>best) setBest('sk_flappy',score);
      speakDeath();
      overlayTitle.textContent='Game Over';
      overlayMsg.innerHTML='You scored <b>'+score+'</b>.<br/>'+statsHtml('flappy');
      bestRow.textContent='Best: '+getBest('sk_flappy');
      startBtn.textContent='Play Again';
      overlay.classList.remove('hidden');
    }
    function update(){
      if(state!=='playing') return;
      frame++;
      bird.vy+=GRAVITY; bird.y+=bird.vy;
      bird.rot=Math.max(-0.5,Math.min(1.2,bird.vy/10));
      if(frame%PIPE_INTERVAL===0) spawnPipe();
      groundOffset-=PIPE_SPEED; if(groundOffset<=-40) groundOffset+=40;
      for(let i=pipes.length-1;i>=0;i--){
        const p=pipes[i]; p.x-=PIPE_SPEED;
        if(!p.passed && p.x+PIPE_W<bird.x-bird.r){
          p.passed=true; score++; scoreBadge.textContent=String(score);
          if(score>0 && score%5===0) speakScore();
        }
        if(p.x<-PIPE_W) pipes.splice(i,1);
      }
      const groundY=H-30;
      if(bird.y+bird.r>groundY || bird.y-bird.r<0){ endGame(); return; }
      for(const p of pipes){
        const withinX=bird.x+bird.r>p.x && bird.x-bird.r<p.x+PIPE_W;
        if(withinX){
          if(bird.y-bird.r<p.top || bird.y+bird.r>p.top+PIPE_GAP){ endGame(); return; }
        }
      }
    }
    function draw(){
      ctx.clearRect(0,0,W,H);
      ctx.save(); ctx.fillStyle='rgba(255,255,255,0.5)';
      for(let i=0;i<18;i++){
        const sx=(i*53+(frame*0.15))%W, sy=(i*37)%150+10;
        ctx.globalAlpha=0.3+0.3*Math.sin(i+frame*0.02);
        ctx.fillRect(sx,sy,2,2);
      }
      ctx.restore();
      for(const p of pipes){
        const grad=ctx.createLinearGradient(p.x,0,p.x+PIPE_W,0);
        grad.addColorStop(0,'#3fae5c'); grad.addColorStop(0.5,'#5fd67f'); grad.addColorStop(1,'#2f8a49');
        ctx.fillStyle=grad;
        ctx.fillRect(p.x,0,PIPE_W,p.top);
        ctx.fillRect(p.x-4,p.top-18,PIPE_W+8,18);
        const bottomY=p.top+PIPE_GAP;
        ctx.fillRect(p.x,bottomY,PIPE_W,H-bottomY-30);
        ctx.fillRect(p.x-4,bottomY,PIPE_W+8,18);
      }
      ctx.fillStyle='#3a2350'; ctx.fillRect(0,H-30,W,30);
      ctx.fillStyle='#513070';
      for(let x=groundOffset;x<W;x+=40) ctx.fillRect(x,H-30,20,6);
      ctx.save(); ctx.translate(bird.x,bird.y); ctx.rotate(bird.rot*0.6);
      ctx.beginPath(); ctx.arc(0,0,bird.r,0,Math.PI*2); ctx.closePath();
      ctx.save(); ctx.clip();
      if(headImg.complete && headImg.naturalWidth) ctx.drawImage(headImg,-bird.r,-bird.r,bird.r*2,bird.r*2);
      else { ctx.fillStyle='#f4c542'; ctx.fill(); }
      ctx.restore();
      ctx.lineWidth=3; ctx.strokeStyle='#f4c542'; ctx.stroke();
      ctx.restore();
    }
    function loop(){ update(); draw(); rafId=requestAnimationFrame(loop); }
    function flap(){
      if(state==='ready'){ state='playing'; }
      if(state==='playing'){ bird.vy=FLAP; }
    }
    function handleInput(e){ if(e) e.preventDefault(); if(state==='over') return; flap(); }
    function init(){
      reset();
      gameTitleEl.textContent='Flappy Head';
      overlayTitle.textContent='Flappy Head';
      overlayMsg.innerHTML='Tap / click / space to fly.<br/>Dodge the poles!';
      bestRow.innerHTML=statsHtml('flappy');
      startBtn.textContent='Start';
      overlay.classList.remove('hidden');
      hintText.textContent='TAP / CLICK / SPACE TO FLAP';
      addInput(canvas,'mousedown',handleInput);
      addInput(canvas,'touchstart',handleInput,{passive:false});
      addInput(window,'keydown',function(e){ if(e.code==='Space') handleInput(e); });
      addInput(startBtn,'click',function(e){ e.preventDefault(); reset(); state='playing'; overlay.classList.add('hidden'); });
      loop();
    }
    return {init};
  })();

  // ============ HEAD BASKET ============
  const BasketGame = (function(){
    let ball, hoop, score, state, timeLeft, lastTime, dragStart, aiming, particles;
    const BALL_R=22, GRAVITY=0.55;
    const ROUND_TIME=30;

    function newBallPos(){ return {x:W/2, y:H-70, vx:0, vy:0, r:BALL_R, moving:false}; }
    function newHoop(){
      return { x: 80+Math.random()*(W-160), y: 90+Math.random()*40, w:70 };
    }
    function reset(){
      ball=newBallPos();
      hoop=newHoop();
      score=0; state='ready'; timeLeft=ROUND_TIME; lastTime=null;
      dragStart=null; aiming=null; particles=[];
      scoreBadge.textContent='0';
    }
    function endGame(){
      state='over';
      pushHistory('basket',score);
      const best=getBest('sk_basket');
      if(score>best) setBest('sk_basket',score);
      speakDeath();
      overlayTitle.textContent='Time Up!';
      overlayMsg.innerHTML='You scored <b>'+score+'</b> baskets.<br/>'+statsHtml('basket');
      bestRow.textContent='Best: '+getBest('sk_basket');
      startBtn.textContent='Play Again';
      overlay.classList.remove('hidden');
    }
    function update(dt){
      if(state!=='playing') return;
      timeLeft-=dt;
      if(timeLeft<=0){ timeLeft=0; endGame(); return; }
      if(ball.moving){
        ball.vy+=GRAVITY;
        ball.x+=ball.vx; ball.y+=ball.vy;
        // hoop collision (score if passes through rim area moving down)
        const rimY=hoop.y, rimX1=hoop.x-hoop.w/2, rimX2=hoop.x+hoop.w/2;
        if(!ball.scored && ball.vy>0 && ball.y>rimY-8 && ball.y<rimY+10 && ball.x>rimX1+8 && ball.x<rimX2-8){
          ball.scored=true;
          score++; scoreBadge.textContent=String(score);
          if(score%3===0) speakScore();
          for(let i=0;i<14;i++) particles.push({x:hoop.x,y:hoop.y,vx:(Math.random()-0.5)*6,vy:(Math.random()-1.5)*6,life:30,color:'#f4c542'});
          hoop=newHoop();
        }
        if(ball.x<ball.r||ball.x>W-ball.r) ball.vx*=-0.6;
        if(ball.y>H+50 || ball.x<-50 || ball.x>W+50){
          ball=newBallPos();
        }
      }
      for(let i=particles.length-1;i>=0;i--){
        const p=particles[i]; p.x+=p.vx; p.y+=p.vy; p.vy+=0.2; p.life--;
        if(p.life<=0) particles.splice(i,1);
      }
    }
    function draw(){
      ctx.clearRect(0,0,W,H);
      // backboard/hoop
      ctx.fillStyle='#eee';
      ctx.fillRect(hoop.x-hoop.w/2-6, hoop.y-40, hoop.w+12, 34);
      ctx.strokeStyle='#ff5e7e'; ctx.lineWidth=5;
      ctx.beginPath(); ctx.moveTo(hoop.x-hoop.w/2,hoop.y); ctx.lineTo(hoop.x+hoop.w/2,hoop.y); ctx.stroke();
      ctx.strokeStyle='rgba(255,255,255,0.5)'; ctx.lineWidth=2;
      for(let i=0;i<4;i++){
        const nx=hoop.x-hoop.w/2+ (i+0.5)*(hoop.w/4);
        ctx.beginPath(); ctx.moveTo(nx,hoop.y); ctx.lineTo(nx,hoop.y+22); ctx.stroke();
      }
      // ball
      ctx.save();
      ctx.beginPath(); ctx.arc(ball.x,ball.y,ball.r,0,Math.PI*2); ctx.closePath();
      ctx.save(); ctx.clip();
      if(headImg.complete && headImg.naturalWidth) ctx.drawImage(headImg,ball.x-ball.r,ball.y-ball.r,ball.r*2,ball.r*2);
      else { ctx.fillStyle='#f4c542'; ctx.fill(); }
      ctx.restore();
      ctx.lineWidth=2; ctx.strokeStyle='#f4c542'; ctx.stroke();
      ctx.restore();
      // aim line
      if(aiming && dragStart){
        ctx.strokeStyle='rgba(244,197,66,0.7)'; ctx.lineWidth=3; ctx.setLineDash([6,6]);
        ctx.beginPath(); ctx.moveTo(ball.x,ball.y);
        ctx.lineTo(ball.x - aiming.dx*3, ball.y - aiming.dy*3);
        ctx.stroke(); ctx.setLineDash([]);
      }
      // particles
      for(const p of particles){
        ctx.globalAlpha=Math.max(0,p.life/30);
        ctx.fillStyle=p.color; ctx.fillRect(p.x,p.y,4,4);
      }
      ctx.globalAlpha=1;
      // timer
      ctx.fillStyle='rgba(13,6,24,0.5)';
      ctx.fillRect(W-70,10,60,26);
      ctx.fillStyle='#fff'; ctx.font='14px sans-serif'; ctx.textAlign='center';
      ctx.fillText(Math.ceil(timeLeft)+'s', W-40, 28);
    }
    function loop(ts){
      if(lastTime==null) lastTime=ts;
      const dt=(ts-lastTime)/1000; lastTime=ts;
      update(dt); draw();
      rafId=requestAnimationFrame(loop);
    }
    function getPos(e){
      const rect=canvas.getBoundingClientRect();
      const scaleX=canvas.width/rect.width, scaleY=canvas.height/rect.height;
      const clientX = e.touches? e.touches[0].clientX : e.clientX;
      const clientY = e.touches? e.touches[0].clientY : e.clientY;
      return {x:(clientX-rect.left)*scaleX, y:(clientY-rect.top)*scaleY};
    }
    function onDown(e){
      if(state!=='playing') return;
      e.preventDefault();
      const pos=getPos(e);
      if(ball.moving) return;
      const d=Math.hypot(pos.x-ball.x,pos.y-ball.y);
      if(d<ball.r*2.2){ dragStart=pos; aiming={dx:0,dy:0}; }
    }
    function onMove(e){
      if(!dragStart) return;
      e.preventDefault();
      const pos=getPos(e);
      aiming={dx:pos.x-dragStart.x, dy:pos.y-dragStart.y};
    }
    function onUp(e){
      if(!dragStart) return;
      e.preventDefault();
      const power=0.16;
      ball.vx = -aiming.dx*power;
      ball.vy = -aiming.dy*power;
      ball.moving=true; ball.scored=false;
      dragStart=null; aiming=null;
    }
    function init(){
      reset();
      gameTitleEl.textContent='Head Basket';
      overlayTitle.textContent='Head Basket';
      overlayMsg.innerHTML='Drag back from the ball<br/>and release to shoot!';
      bestRow.innerHTML=statsHtml('basket');
      startBtn.textContent='Start';
      overlay.classList.remove('hidden');
      hintText.textContent='DRAG THE BALL BACK, RELEASE TO SHOOT';
      addInput(canvas,'mousedown',onDown);
      addInput(canvas,'mousemove',onMove);
      addInput(window,'mouseup',onUp);
      addInput(canvas,'touchstart',onDown,{passive:false});
      addInput(canvas,'touchmove',onMove,{passive:false});
      addInput(canvas,'touchend',onUp,{passive:false});
      addInput(startBtn,'click',function(e){ e.preventDefault(); reset(); state='playing'; overlay.classList.add('hidden'); lastTime=null; });
      rafId=requestAnimationFrame(loop);
    }
    return {init};
  })();

  // ============ SIZE MATCH ============
  const MatchGame = (function(){
    let target, options, score, lives, state, round;
    function newRound(){
      const sizes=[18,24,30,36,44,52];
      const shuffled=sizes.slice().sort(()=>Math.random()-0.5);
      const targetR = shuffled[0];
      const pool=[targetR];
      while(pool.length<4){
        const r = shuffled[pool.length];
        if(!pool.includes(r)) pool.push(r);
      }
      pool.sort(()=>Math.random()-0.5);
      const spacing = W/(pool.length+1);
      options = pool.map((r,i)=>({ r, x: spacing*(i+1), y: H-100, correct: r===targetR, hit:false }));
      target = { r: targetR, x: W/2, y: 110 };
    }
    function reset(){ score=0; lives=3; state='ready'; round=0; scoreBadge.textContent='0'; newRound(); }
    function endGame(){
      state='over';
      pushHistory('match',score);
      const best=getBest('sk_match');
      if(score>best) setBest('sk_match',score);
      speakDeath();
      overlayTitle.textContent='Game Over';
      overlayMsg.innerHTML='You matched <b>'+score+'</b> correctly.<br/>'+statsHtml('match');
      bestRow.textContent='Best: '+getBest('sk_match');
      startBtn.textContent='Play Again';
      overlay.classList.remove('hidden');
    }
    function draw(){
      ctx.clearRect(0,0,W,H);
      ctx.fillStyle='#c9b8e0'; ctx.font='14px sans-serif'; ctx.textAlign='center';
      ctx.fillText('MATCH THIS SIZE', W/2, target.y - target.r - 16);
      drawHeadCircle(target.x,target.y,target.r,'#ff5e7e');
      for(const o of options){
        drawHeadCircle(o.x,o.y,o.r, o.hit ? (o.correct?'#4bd47a':'#ff5e7e') : '#f4c542');
      }
      // lives
      ctx.fillStyle='rgba(13,6,24,0.5)'; ctx.fillRect(10,10,90,26);
      ctx.fillStyle='#fff'; ctx.font='14px sans-serif'; ctx.textAlign='left';
      ctx.fillText('Lives: '+lives, 18, 28);
    }
    function drawHeadCircle(x,y,r,strokeColor){
      ctx.save();
      ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2); ctx.closePath();
      ctx.save(); ctx.clip();
      if(headImg.complete && headImg.naturalWidth) ctx.drawImage(headImg,x-r,y-r,r*2,r*2);
      else { ctx.fillStyle='#f4c542'; ctx.fill(); }
      ctx.restore();
      ctx.lineWidth=3; ctx.strokeStyle=strokeColor; ctx.stroke();
      ctx.restore();
    }
    function loop(){ draw(); rafId=requestAnimationFrame(loop); }
    function getPos(e){
      const rect=canvas.getBoundingClientRect();
      const scaleX=canvas.width/rect.width, scaleY=canvas.height/rect.height;
      const clientX = e.touches? e.changedTouches[0].clientX : e.clientX;
      const clientY = e.touches? e.changedTouches[0].clientY : e.clientY;
      return {x:(clientX-rect.left)*scaleX, y:(clientY-rect.top)*scaleY};
    }
    function onTap(e){
      if(state!=='playing') return;
      e.preventDefault();
      const pos=getPos(e);
      for(const o of options){
        if(o.hit) continue;
        const d=Math.hypot(pos.x-o.x,pos.y-o.y);
        if(d<o.r){
          o.hit=true;
          if(o.correct){
            score++; scoreBadge.textContent=String(score);
            if(score%4===0) speakScore();
            setTimeout(()=>{ if(state==='playing') newRound(); }, 260);
          } else {
            lives--;
            setTimeout(()=>{ if(state!=='playing') return; if(lives<=0) endGame(); else newRound(); }, 260);
          }
          break;
        }
      }
    }
    function init(){
      reset();
      gameTitleEl.textContent='Size Match';
      overlayTitle.textContent='Size Match';
      overlayMsg.innerHTML='Tap the head that matches<br/>the size shown at top.<br/>3 lives!';
      bestRow.innerHTML=statsHtml('match');
      startBtn.textContent='Start';
      overlay.classList.remove('hidden');
      hintText.textContent='TAP THE MATCHING SIZE';
      addInput(canvas,'mousedown',onTap);
      addInput(canvas,'touchstart',onTap,{passive:false});
      addInput(startBtn,'click',function(e){ e.preventDefault(); reset(); state='playing'; overlay.classList.add('hidden'); });
      loop();
    }
    return {init};
  })();

  // ============ HEAD SLICER ============
  const SlicerGame = (function(){
    let fruits, score, lives, state, frame, trail, lastSpawn;
    const GRAVITY=0.28;
    function spawnFruit(){
      const x = 60+Math.random()*(W-120);
      const vx = (Math.random()-0.5)*3;
      const vy = -(9+Math.random()*3);
      fruits.push({x,y:H-20,vx,vy,r:26,sliced:false,rot:0,vrot:(Math.random()-0.5)*0.2});
    }
    function reset(){
      fruits=[]; score=0; lives=3; state='ready'; frame=0; trail=[]; lastSpawn=0;
      scoreBadge.textContent='0';
    }
    function endGame(){
      state='over';
      pushHistory('slicer',score);
      const best=getBest('sk_slicer');
      if(score>best) setBest('sk_slicer',score);
      speakDeath();
      overlayTitle.textContent='Game Over';
      overlayMsg.innerHTML='You sliced <b>'+score+'</b> heads.<br/>'+statsHtml('slicer');
      bestRow.textContent='Best: '+getBest('sk_slicer');
      startBtn.textContent='Play Again';
      overlay.classList.remove('hidden');
    }
    function update(){
      if(state!=='playing') return;
      frame++;
      if(frame-lastSpawn > 55 - Math.min(25,score)){ spawnFruit(); lastSpawn=frame; }
      for(let i=fruits.length-1;i>=0;i--){
        const f=fruits[i];
        f.vy+=GRAVITY; f.x+=f.vx; f.y+=f.vy; f.rot+=f.vrot;
        if(f.y>H+60){
          fruits.splice(i,1);
          if(!f.sliced){ lives--; if(lives<=0){ endGame(); return; } }
        }
      }
      while(trail.length>10) trail.shift();
    }
    function draw(){
      ctx.clearRect(0,0,W,H);
      for(const f of fruits){
        ctx.save();
        ctx.translate(f.x,f.y); ctx.rotate(f.rot);
        ctx.globalAlpha = f.sliced ? 0.5 : 1;
        ctx.beginPath(); ctx.arc(0,0,f.r,0,Math.PI*2); ctx.closePath();
        ctx.save(); ctx.clip();
        if(headImg.complete && headImg.naturalWidth) ctx.drawImage(headImg,-f.r,-f.r,f.r*2,f.r*2);
        else { ctx.fillStyle='#f4c542'; ctx.fill(); }
        ctx.restore();
        ctx.lineWidth=3; ctx.strokeStyle= f.sliced ? '#4bd47a' : '#f4c542'; ctx.stroke();
        ctx.restore();
        ctx.globalAlpha=1;
      }
      if(trail.length>1){
        ctx.strokeStyle='rgba(255,255,255,0.7)'; ctx.lineWidth=4; ctx.lineCap='round';
        ctx.beginPath();
        ctx.moveTo(trail[0].x,trail[0].y);
        for(let i=1;i<trail.length;i++) ctx.lineTo(trail[i].x,trail[i].y);
        ctx.stroke();
      }
      ctx.fillStyle='rgba(13,6,24,0.5)'; ctx.fillRect(10,10,90,26);
      ctx.fillStyle='#fff'; ctx.font='14px sans-serif'; ctx.textAlign='left';
      ctx.fillText('Lives: '+lives, 18, 28);
    }
    function loop(){ update(); draw(); rafId=requestAnimationFrame(loop); }
    function getPos(e){
      const rect=canvas.getBoundingClientRect();
      const scaleX=canvas.width/rect.width, scaleY=canvas.height/rect.height;
      const t = e.touches ? e.touches[0] : e;
      return {x:(t.clientX-rect.left)*scaleX, y:(t.clientY-rect.top)*scaleY};
    }
    let slicing=false;
    function onDown(e){
      if(state!=='playing') return;
      e.preventDefault();
      slicing=true; trail=[getPos(e)];
    }
    function onMove(e){
      if(!slicing) return;
      e.preventDefault();
      const pos=getPos(e);
      trail.push(pos);
      for(const f of fruits){
        if(f.sliced) continue;
        const d=Math.hypot(pos.x-f.x,pos.y-f.y);
        if(d<f.r+8){
          f.sliced=true;
          score++; scoreBadge.textContent=String(score);
          if(score%6===0) speakScore();
        }
      }
    }
    function onUp(e){ slicing=false; trail=[]; }
    function init(){
      reset();
      gameTitleEl.textContent='Head Slicer';
      overlayTitle.textContent='Head Slicer';
      overlayMsg.innerHTML='Swipe across the flying heads<br/>to slice them. Do not miss too many!<br/>3 lives.';
      bestRow.innerHTML=statsHtml('slicer');
      startBtn.textContent='Start';
      overlay.classList.remove('hidden');
      hintText.textContent='SWIPE TO SLICE';
      addInput(canvas,'mousedown',onDown);
      addInput(canvas,'mousemove',onMove);
      addInput(window,'mouseup',onUp);
      addInput(canvas,'touchstart',onDown,{passive:false});
      addInput(canvas,'touchmove',onMove,{passive:false});
      addInput(canvas,'touchend',onUp,{passive:false});
      addInput(startBtn,'click',function(e){ e.preventDefault(); reset(); state='playing'; overlay.classList.add('hidden'); });
      loop();
    }
    return {init};
  })();

})();
</script>
